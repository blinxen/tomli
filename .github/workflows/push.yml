name: Tests

on:
  push:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "**.rs"
    branches:
      - "master"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "**.rs"
    branches:
      - "master"

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Restore cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - run: |
          cargo clippy
          cargo test --verbose
